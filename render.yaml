services:
  # ── BACKEND (Node.js + Python scraper) ──
  - type: web
    name: foodiq-backend
    runtime: node
    rootDir: backend
    buildCommand: |
      apt-get install -y chromium-browser chromium-chromedriver python3 python3-pip &&
      pip3 install selenium webdriver-manager --break-system-packages &&
      npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_PATH
        value: python3

  # ── FRONTEND (React) ──
  - type: web
    name: foodiq-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build -l 3000
    envVars:
      - key: NODE_ENV
        value: production